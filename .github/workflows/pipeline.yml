name: nightly-pipeline

on:
  schedule:
    - cron: "30 18 * * *"   # 18:30 UTC = 00:00 IST
  workflow_dispatch:         # adds a "Run workflow" button

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Write service account key
        env:
          KEY_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$KEY_JSON" > secrets/service_account.json

      - name: Run pipeline
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
          OUTPUT_SHEET_ID: ${{ secrets.OUTPUT_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: secrets/service_account.json
        run: python src/run_pipeline.py